name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # الإجراءات مثبّتة بالـ SHA (E26.10): الوسم قد يُنقل إلى كود آخر. Dependabot (github-actions) يرفعها شهرياً
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 (v2)
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, intl, bcmath, gd, zip
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations run on a fresh database
        run: |
          touch "$RUNNER_TEMP/fresh.sqlite"
          DB_CONNECTION=sqlite DB_DATABASE="$RUNNER_TEMP/fresh.sqlite" php artisan migrate --force

      - name: Tests
        run: php artisan test

      - name: Code style (changed files only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: vendor/bin/pint --test --diff=origin/${{ github.base_ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Frontend tests and build
        run: |
          npm ci
          npm test
          npm run build

      # بوابتا التدقيق (E26.9): high وcritical الجديدة غير المستثناة بسبب (composer.json audit.ignore
      # وsecurity/npm-audit-baseline.json). تقرير فقط حتى يضبط المالك متغير المستودع NUSKJO_AUDIT_GATE=enforce
      - name: Dependency audit gate (composer)
        continue-on-error: ${{ vars.NUSKJO_AUDIT_GATE != 'enforce' }}
        run: composer run audit:php

      - name: Dependency audit gate (npm, runtime)
        continue-on-error: ${{ vars.NUSKJO_AUDIT_GATE != 'enforce' }}
        run: node scripts/audit/npm-audit-gate.mjs
