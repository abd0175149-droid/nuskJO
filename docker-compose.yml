# ============================================================
# NUSKJO — Docker Compose (Production)
# Port: 4020 → Cloudflare Tunnel → nuskjo.grade.sbs
# ============================================================

services:
  nuskjo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuskjo-app
    restart: unless-stopped
    ports:
      - "4020:4020"
    volumes:
      # Persist storage (uploads, logs)
      - nuskjo-storage:/var/www/html/storage
      # Persist SQLite database
      - nuskjo-database:/var/www/html/database
    environment:
      - APP_NAME=NUSKJO
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://nuskjo.grade.sbs
      - APP_LOCALE=ar
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
      - DB_CONNECTION=sqlite
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SAR_TO_JOD=0.19
    env_file:
      - .env.production
    healthcheck:
      # /up يمرّ بإقلاع Laravel فعلاً؛ / كان ينجح بمجرد التحويل إلى صفحة الدخول
      test: ["CMD", "curl", "-fsS", "http://localhost:4020/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # تمرين الاستعادة المعزول (scripts/backup/drill.sh): لا شبكة، ولا أي حجم إنتاجي، ونظام ملفات للقراءة فقط.
  # لا يعمل مع «docker compose up»؛ فقط: docker compose --profile drill run --rm -T nuskjo-drill
  nuskjo-drill:
    image: ${DRILL_IMAGE:-nuskjo-nuskjo-app:latest}
    profiles: [drill]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /var/www/html/storage:size=256m
      - /var/www/html/bootstrap/cache:size=16m
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/tmp/drill/database.sqlite
      - CACHE_STORE=array
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=array
      - BROADCAST_CONNECTION=null
      - BACKUP_PRE_MIGRATE=false
      - LOG_CHANNEL=stderr
    entrypoint: ["/bin/sh", "/var/www/html/docker/drill-inside.sh"]

volumes:
  nuskjo-storage:
    driver: local
  nuskjo-database:
    driver: local
