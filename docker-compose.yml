# ============================================================
# NUSKJO — Docker Compose (Production)
# Port: 4020 → Cloudflare Tunnel → nuskjo.masaros.net (الأساسي) وnuskjo.grade.sbs (الاحتياطي)
# ============================================================

services:
  nuskjo-app:
    build:
      context: .
      dockerfile: Dockerfile
      # VITE_* لمرحلة الواجهة دون خبز .env.production في الصورة
      secrets:
        - vite_env
    container_name: nuskjo-app
    restart: unless-stopped
    # يتسع لـ stopwaitsecs=130 لعامل الطابور: وظيفة رد جارية تكتمل بدل أن تُقتل عند كل نشر
    stop_grace_period: 140s
    # تقوية الحاوية (E26.8). no-new-privileges: supervisord وphp-fpm وnginx يُسقطون الصلاحيات من root ولا يرفعونها،
    # وكروميوم يعمل بـ --no-sandbox. الحدود في /opt/nuskJO/.env (تعويض compose) بعد قياس scripts/security/measure-memory.sh
    # وops:smoke-card: الذاكرة ضعف القمة ولا تقل عن 2g، وpids يعدّ الخيوط (كروميوم وحده عشرات، و20 عامل php-fpm والطوابير وReverb).
    # 0 يرفع الحد في الطوارئ. مؤجل عمداً: read_only وcap_drop [ALL]، لأن الإقلاع ينفّذ chown وconfig:cache بـ root
    # وsupervisord يبدأ بـ root؛ تغيير ذلك مشروع مستقل يمس قالب كل المشاريع
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${NUSKJO_MEM_LIMIT:-3g}
    memswap_limit: ${NUSKJO_MEM_LIMIT:-3g}
    pids_limit: ${NUSKJO_PIDS_LIMIT:-1024}
    cpus: ${NUSKJO_CPUS:-2.0}
    ports:
      # NUSKJO_BIND_ADDRESS=127.0.0.1 (في /opt/nuskJO/.env لتعويض compose) يقصر المنفذ على المضيف بعد تحويل قاعدة النفق
      # إلى http://127.0.0.1:4020 (docs/RELEASE.md «ربط المنفذ»). بلا قيمة: كل الواجهات كما اليوم
      - "${NUSKJO_BIND_ADDRESS:-}${NUSKJO_BIND_ADDRESS:+:}4020:4020"
    volumes:
      # Persist storage (uploads, logs)
      - nuskjo-storage:/var/www/html/storage
      # القاعدة وحدها في حجمها (database/data)، فتصل هجرات الصورة الجديدة بالبناء دون docker cp.
      # الانتقال من الحجم القديم بـ scripts/backup/move-db-volume.sh (docs/RELEASE.md)، لا بإعادة التشغيل.
      - nuskjo-dbdata:/var/www/html/database/data
    environment:
      - APP_NAME=NUSKJO
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${NUSKJO_APP_URL:-https://nuskjo.masaros.net}
      - APP_LOCALE=ar
      - LOG_CHANNEL=stack
      # warning لا error: تحذيرات الواتساب (حدث حساب، توقيع خاطئ) كانت تسقط. يومي بـ 14 يوماً
      - LOG_LEVEL=warning
      - LOG_STACK=daily
      - LOG_DAILY_DAYS=14
      # أحداث الواتساب في storage/logs/whatsapp-*.log (JSON، بلا بيانات عملاء)
      - WA_LOG_LEVEL=info
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/data/database.sqlite
      # E07.11: WAL ومهلة القفل 60 ثانية (صريحة هنا لا في الافتراضي وحده). IMMEDIATE منذ 2026-10-19: مع DEFERRED
      # كان حجز وظيفة من الطابور يفشل فوراً بـ «database is locked» عند ترقية القراءة إلى كتابة (14 مرة في يومين)
      - DB_JOURNAL_MODE=wal
      - DB_BUSY_TIMEOUT=60000
      - DB_SYNCHRONOUS=normal
      - DB_TRANSACTION_MODE=IMMEDIATE
      # E08: فحص /up الحقيقي وفحوص ميتا. مطفآن حتى يُضبطا في /opt/nuskJO/.env (تعويض compose)، مرحلةً مرحلة (docs/RELEASE.md)
      - OPS_HEALTH_CHECKS=${OPS_HEALTH_CHECKS:-false}
      # E09: أحداث التدقيق غير المالية وصفحة /audit-logs (مطفآن حتى يُضبطا في /opt/nuskJO/.env)
      - AUDIT_EXTENDED=${AUDIT_EXTENDED:-false}
      - AUDIT_PAGE=${AUDIT_PAGE:-false}
      # E13: مدة الاحتفاظ بالمحادثات (0 = لا تقليم) حتى يقرّرها المالك في /opt/nuskJO/.env
      - WA_RETENTION_DAYS=${WA_RETENTION_DAYS:-0}
      # E26: سياسة أمن المحتوى (report افتراضياً: تقارير بلا حجب؛ enforce بعد أسبوع نظيف؛ off للطوارئ)،
      # وصلاحيات storage (legacy حتى يُتحقق من ضم nginx إلى مجموعة www-data، ثم strict: 750/640)
      - CSP_MODE=${CSP_MODE:-report}
      - CSP_CONNECT_EXTRA=${CSP_CONNECT_EXTRA:-}
      - NUSKJO_STORAGE_PERMS=${NUSKJO_STORAGE_PERMS:-legacy}
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SAR_TO_JOD=0.19
      # E28: الخادم ينشر إلى Reverb داخل الحاوية مباشرة (لا عبر النفق و/apps)، بمهلة ثانيتين. المتصفح على VITE_REVERB_*.
      # أصل المقبس بالمضيف وحده؛ '*' مؤقتاً في /opt/nuskJO/.env للتراجع (docs/RELEASE.md «البث اللحظي الآمن»)
      - REVERB_PUBLISH_HOST=${REVERB_PUBLISH_HOST:-127.0.0.1}
      - REVERB_PUBLISH_PORT=${REVERB_PUBLISH_PORT:-8080}
      - REVERB_PUBLISH_SCHEME=${REVERB_PUBLISH_SCHEME:-http}
      - REVERB_ALLOWED_ORIGINS=${REVERB_ALLOWED_ORIGINS:-nuskjo.masaros.net,nuskjo.grade.sbs}
      # بوابة واتساب (nuskjo-openwa) داخل شبكة compose. المفتاح الرئيس للإدارة فقط (إنشاء الجلسات ومفاتيحها
      # والـ webhooks)؛ كل إرسال وقراءة بمفتاح الرقم المحصور بجلسته (wa_channels.api_key)
      - OPENWA_URL=http://nuskjo-openwa:2785
      - OPENWA_ADMIN_KEY=${OPENWA_API_MASTER_KEY:-}
      - OPENWA_WEBHOOK_BASE=http://nuskjo-app:4020
    env_file:
      - .env.production
    # سجلات الحاوية مدوّرة: 5 ملفات × 10MB (nginx وphp-fpm يكتبان إلى stdout/stderr)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # /up يفحص القاعدة والمجدول والعاملين (OPS_HEALTH_CHECKS)؛ / كان ينجح بمجرد التحويل إلى صفحة الدخول.
      # start_period: أول نبضة بعد الإقلاع. unhealthy للرؤية والتنبيه فقط، لا إعادة تشغيل آلية
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Accept: application/json", "http://localhost:4020/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # بوابة واتساب نُسك (OpenWA + whatsapp-web.js): كل أرقام نُسك جلسات عليها، ولا يشاركها مشروع آخر.
  # الصورة تُبنى من docker/openwa (الرسمية + رقعتا WB web). لا منفذ للإنترنت: nuskjo-app يصلها بالاسم داخل الشبكة،
  # واللوحة على 127.0.0.1:4021 عبر نفق SSH فقط. حدود المحرك مطفأة لأن نُسك يدير حدوده (docker/openwa/README.md).
  # scripts/deploy.sh لا يعيد تشغيلها مع نشر التطبيق (--no-deps)، بل فقط عند تغيّر docker/openwa.
  nuskjo-openwa:
    build:
      context: ./docker/openwa
      args:
        OPENWA_VERSION: "0.24.0"
    image: nuskjo-openwa:0.24.0
    container_name: nuskjo-openwa
    restart: unless-stopped
    # أطول من WEBHOOK_SHUTDOWN_DRAIN_MS: تسليم جارٍ يكتمل، وكروميوم يُغلق الجلسات بنظافة
    stop_grace_period: 75s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 2048
    # نحو 300 إلى 500MB لكل رقم. 2g تتسع لثلاثة أرقام، وتُرفع في /opt/nuskJO/.env عند إضافة رقم رابع
    mem_limit: ${NUSKJO_OPENWA_MEM_LIMIT:-2g}
    memswap_limit: ${NUSKJO_OPENWA_MEM_LIMIT:-2g}
    ports:
      - "127.0.0.1:4021:2785"
    environment:
      NODE_ENV: production
      TZ: Asia/Amman
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      PORT: 2785
      LOG_LEVEL: info
      BASE_URL: http://127.0.0.1:4021
      DASHBOARD_URL: http://127.0.0.1:4021
      CORS_ORIGINS: http://127.0.0.1:4021
      # الأسرار في /opt/nuskJO/.env بلا قيم احتياطية: غيابها يُفشل الإقلاع. الـ pepper لا يتغير أبداً
      API_MASTER_KEY: ${OPENWA_API_MASTER_KEY:?اضبط OPENWA_API_MASTER_KEY في /opt/nuskJO/.env}
      API_KEY_PEPPER: ${OPENWA_API_KEY_PEPPER:?اضبط OPENWA_API_KEY_PEPPER في /opt/nuskJO/.env}
      ENABLE_SWAGGER: "true"
      # SQLite داخل /app/data تكفي لبضعة أرقام، فلا حاجة لـ Postgres وذاكرته
      DATABASE_TYPE: sqlite
      DATABASE_SYNCHRONIZE: "false"
      # Redis للطابور: الـ webhooks تمر عبر BullMQ فلا تضيع عند إعادة التشغيل.
      # قيمة حرفية لا ${...:-}، لأن الكود يقرأ === 'true' لحظة الاستيراد
      REDIS_ENABLED: "true"
      REDIS_HOST: nuskjo-openwa-redis
      REDIS_PORT: 6379
      QUEUE_ENABLED: "true"
      SESSION_DATA_PATH: /app/data/sessions
      PUPPETEER_HEADLESS: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/puppeteer-chrome
      ENGINE_TYPE: whatsapp-web.js
      AUTO_START_SESSIONS: "true"
      # المرسل خلف معرّف خصوصية (@lid): الرقم الحقيقي يصل في senderPhone
      RESOLVE_LID_TO_PHONE: "true"
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      # ── حدود المحرك مطفأة: نُسك يدير حدوده لكل رقم ونوع (wa_send_limits وSendGovernor) ──
      SEND_PACING_ENABLED: "false"
      SIMULATE_TYPING: "false"
      MAX_CONCURRENT_SESSIONS: "0"
      WEBHOOK_MAX_PER_SESSION: "0"
      # حد المعدّل لكل عنوان IP لا يُطفأ (أقله 1)، وكل طلبات نُسك من عنوان واحد
      RATE_LIMIT_SHORT_LIMIT: "100000"
      RATE_LIMIT_MEDIUM_LIMIT: "100000"
      RATE_LIMIT_LONG_LIMIT: "100000"
      BODY_SIZE_LIMIT: 70mb
      # ── الـ webhook إلى nuskjo-app ──
      WEBHOOK_TIMEOUT: "10000"
      WEBHOOK_RETRY_DELAY: "5000"
      WEBHOOK_SHUTDOWN_DRAIN_MS: "15000"
      # لا وسائط مضمّنة في الحمولة: كل وسيط omitted ويجلبه نُسك عند الحاجة من /messages/{chat}/{id}/media
      # (التفريغ والأرشفة)، فتبقى الـ webhooks صغيرة ولا تمر ملفات العملاء في طابور Redis
      WEBHOOK_MEDIA_INLINE_MAX_BYTES: "0"
      WEBHOOK_MAX_PAYLOAD_BYTES: "1048576"
      # حارس SSRF يمنع العناوين الخاصة؛ يُسمح لحاوية التطبيق وحدها بالاسم
      SSRF_ALLOWED_HOSTS: nuskjo-app
      MCP_ENABLED: "false"
      UPDATE_CHECK_ENABLED: "false"
      PLUGINS_DIR: /app/data/plugins
    volumes:
      # الجلسات وmain.sqlite (المفاتيح والـ webhooks). خارج النسخ الاحتياطي عمداً (docker/openwa/README.md)
      - nuskjo-openwa-data:/app/data
    depends_on:
      nuskjo-openwa-redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nuskjo-openwa-redis:
    image: redis:7-alpine
    container_name: nuskjo-openwa-redis
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    # appendonly: مهام الطابور حالة حقيقية. noeviction: BullMQ يرفض غيرها
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m
    volumes:
      - nuskjo-openwa-redis:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # تمرين الاستعادة المعزول (scripts/backup/drill.sh): لا شبكة، ولا أي حجم إنتاجي، ونظام ملفات للقراءة فقط.
  # لا يعمل مع «docker compose up»؛ فقط: docker compose --profile drill run --rm -T nuskjo-drill
  nuskjo-drill:
    image: ${DRILL_IMAGE:-nuskjo-nuskjo-app:latest}
    profiles: [drill]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /var/www/html/storage:size=256m
      - /var/www/html/bootstrap/cache:size=16m
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/tmp/drill/database.sqlite
      - CACHE_STORE=array
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=array
      - BROADCAST_CONNECTION=null
      - BACKUP_PRE_MIGRATE=false
      - LOG_CHANNEL=stderr
    entrypoint: ["/bin/sh", "/var/www/html/docker/drill-inside.sh"]

secrets:
  vite_env:
    file: ./.env.production

volumes:
  nuskjo-storage:
    driver: local
  nuskjo-dbdata:
    driver: local
  # جلسات بوابة واتساب وmain.sqlite. فقدانه = مسح QR جديد لكل رقم، لا فقدان رسائل
  nuskjo-openwa-data:
    driver: local
  nuskjo-openwa-redis:
    driver: local
  # الحجم القديم nuskjo_nuskjo-database غير معلن هنا عن قصد: يبقى كما هو للرجوع، ولا يحذفه «docker compose down -v».
  # حذفه يدوياً بعد 30 يوماً على الأقل وبقرار المالك.
