[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Process idle timeout
pm.process_idle_timeout = 10s

; Error logging: إلى stderr عبر catch_workers_output في صورة php الرسمية، ثم docker logs المدوّرة
php_admin_flag[log_errors] = on
