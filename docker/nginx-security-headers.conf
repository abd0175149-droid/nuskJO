# ترويسات الأمان الثابتة لكل رد (E26.5)، تُنسخ إلى /etc/nginx/snippets/security-headers.conf.
# nginx لا يورّث add_header إلى location فيه add_header خاص، فكل location كهذا يضمّن هذا الملف صراحةً
# (tests/Unit/Security/NginxConfigTest يحرس ذلك). سياسة CSP للصفحات من التطبيق (SecurityHeaders) لا من هنا.
#
# - لا X-XSS-Protection: مهجورة وقد تضر.
# - HSTS لمضيف nuskjo وحده: بلا includeSubDomains ولا preload، لأن المنطقة مشتركة بين مشاريع كثيرة.
#   المتصفح يقرؤها عبر HTTPS في Cloudflare فقط؛ طلبات http الداخلية على المنفذ 4020 يتجاهلها.
# - Permissions-Policy: الموقع للأصل نفسه (CheckInWidget)، والميكروفون للأصل نفسه لتسجيل رسائل الموظف الصوتية (E34).
#   لا إطار مضمّن ولا أصل آخر يحصل على أيهما، والكاميرا والدفع وUSB مغلقة.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
