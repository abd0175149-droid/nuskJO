[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/var/run/supervisord.pid

[program:nginx]
; يبدأ أولاً ويتوقف آخراً: يواصل استقبال الويبهوك وتخزينه أثناء تصريف الطابور
priority=100
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
; يبدأ أولاً ويتوقف آخراً: يواصل استقبال الويبهوك وتخزينه أثناء تصريف الطابور
priority=100
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue]
; طابور default: الإشعارات (SendPushNotification، مهلتها 30) والنسخ اليدوي. ردود البوت في laravel-wa
command=/usr/local/bin/php /var/www/html/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
; لا FATAL بعد ثلاث محاولات سريعة (قاعدة مشغولة لحظة الإقلاع)
startsecs=5
startretries=10
user=www-data
numprocs=1
stdout_logfile=/var/www/html/storage/logs/queue-worker.log
stderr_logfile=/var/www/html/storage/logs/queue-worker-error.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
priority=900
stopwaitsecs=40

[program:laravel-wa]
; ردود البوت وحدها (services.whatsapp.reply_queue). بلا --tries: retryUntil في الوظيفة يحكم الإعادة،
; وWithoutOverlapping يعيدها كل 5 ثوانٍ ما دامت المحادثة مشغولة. sleep=3 من ميزانية الحمل (E24)
command=/usr/local/bin/php /var/www/html/artisan queue:work database --queue=wa-replies --sleep=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
; لا FATAL بعد ثلاث محاولات سريعة (قاعدة مشغولة لحظة الإقلاع)
startsecs=5
startretries=10
user=www-data
; عامل واحد حتى أسبوع نظيف بعد WAL وفصل الطابور (E07.13 في docs/RELEASE.md)
numprocs=1
stdout_logfile=/var/www/html/storage/logs/queue-wa.log
stderr_logfile=/var/www/html/storage/logs/queue-wa-error.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
; الرقم الأعلى يتوقف أولاً: العامل قبل nginx وphp-fpm (100)، وينتظر وظيفة الرد الجارية حتى تنتهي
; (مهلتها 125 ثانية، وstop_grace_period في compose 140)
priority=900
stopwaitsecs=130

[program:laravel-media]
; أرشفة مرفقات العملاء (E14، طابور wa-media): تنزيل قد يطول 90 ثانية لا يؤخر رداً ولا إشعاراً.
; بلا عمل ما دام العلم media_archive مطفأ. الوظيفة 120 < --timeout 125 < stopwaitsecs 130 < stop_grace_period 140
command=/usr/local/bin/php /var/www/html/artisan queue:work database --queue=wa-media --sleep=5 --max-time=3600 --memory=192 --timeout=125
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=10
user=www-data
numprocs=1
stdout_logfile=/var/www/html/storage/logs/queue-media.log
stderr_logfile=/var/www/html/storage/logs/queue-media-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
priority=900
stopwaitsecs=130

[program:reverb]
; على loopback وحده (E28): nginx يمرر /app/ للمتصفح، والخادم ينشر إلى 127.0.0.1:8080 مباشرة
command=/usr/local/bin/php /var/www/html/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
user=www-data
numprocs=1
stdout_logfile=/var/www/html/storage/logs/reverb.log
stderr_logfile=/var/www/html/storage/logs/reverb-error.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
stopwaitsecs=10

[program:laravel-schedule]
command=/usr/local/bin/php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
; لا FATAL بعد ثلاث محاولات سريعة (قاعدة مشغولة لحظة الإقلاع)
startsecs=5
startretries=10
user=www-data
numprocs=1
stdout_logfile=/var/www/html/storage/logs/schedule.log
stderr_logfile=/var/www/html/storage/logs/schedule-error.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
stopwaitsecs=10
