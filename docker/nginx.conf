# بلا query: رابط التحقق من الويبهوك يحمل hub.verify_token، وبحث المحادثات قد يحمل هاتفاً أو اسماً
log_format noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time cf=$http_cf_ray';

server {
    listen 4020;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # بلا رقم إصدار nginx في الترويسات وصفحات الخطأ (E26)
    server_tokens off;
    # الحد العام باقٍ حتى تحسم E32 حاجة رفع الملفات (A16)؛ الويبهوك له كتلته أدناه بحد 4m
    client_max_body_size 50M;
    # cloudflared يعيد استعمال الاتصال الخامل حتى 90 ثانية: الإغلاق قبله ينتج 502 متقطعاً على POST
    keepalive_timeout 100s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ترويسات الأمان (E26): ملف مشترك يُضمَّن هنا وفي كل location فيه add_header خاص،
    # لأن nginx لا يورّث add_header إلى كتلة تضيف ترويسة بنفسها
    include /etc/nginx/snippets/security-headers.conf;

    # عامل خدمة الإشعارات: بلا كاش، وإلا بقي المتصفح وCloudflare على نسخة قديمة 30 يوماً
    location = /firebase-messaging-sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ملفات القرص العام (بطاقات العروض والقوالب والشعارات، E26): قبل كتلة الملفات الثابتة، فلا تأخذ صور بطاقات
    # يُعاد توليدها immutable ثلاثين يوماً، وsandbox يمنع تنفيذ أي ملف يُفتح مباشرة. ميتا تجلب البطاقة بـ image.link
    # من هنا، والترويسات لا تؤثر في الجلب
    location ^~ /storage/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'self'; sandbox" always;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
        try_files $uri =404;

        # قوالب الطباعة: عارض PDF في كروميوم قد يُحجب تحت sandbox، وpdf.js يجلبها بـ fetch فلا تؤثر فيه الترويسة
        location ~* \.pdf$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        # ^~ يوقف البحث في كتل التعابير على مستوى server، فحجب الملفات النقطية يُكرَّر هنا
        location ~ /\. {
            deny all;
        }
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vite build assets (immutable)
    location /build/ {
        expires 1y;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket proxy for Laravel Reverb
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Reverb API (broadcasting auth)
    location /apps {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # فحص Docker كل 30 ثانية: بلا سطر في السجل
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # ويبهوك ميتا (E20): حد 4m (ميتا لا ترسل أكثر من 3MB)، ومهل قصيرة متسقة: PHP 55 < هنا 60 < Cloudflare 100.
    # إلى index.php مباشرة لا عبر try_files، فيُقاس حتى الجسم المرسل بلا Content-Length بحد هذه الكتلة.
    # لا limit_req: لا حد معدّل ولا 429 على طلب موقّع. السجل بلا query (رابط التحقق يحمل hub.verify_token)
    location = /api/whatsapp/webhook {
        client_max_body_size 4m;
        client_body_buffer_size 512k;
        client_body_timeout 20s;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # تقارير CSP من المتصفحات (E26.4): جسم صغير دائماً، فلا يُقرأ أكبر من 16k قبل أن يصل PHP (413)
    location = /csp-report {
        client_max_body_size 16k;
        client_body_timeout 10s;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 15s;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to sensitive files
    location ~ /(?:composer|package|artisan|phpunit|\.env) {
        deny all;
    }

    # إلى docker logs المدوّرة لا إلى ملفات داخل طبقة الحاوية بلا تدوير
    access_log /dev/stdout noquery;
    error_log /dev/stderr warn;
}
