# بلا query: رابط التحقق من الويبهوك يحمل hub.verify_token، وبحث المحادثات قد يحمل هاتفاً أو اسماً
log_format noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time cf=$http_cf_ray';

server {
    listen 4020;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # الحد العام باقٍ حتى تحسم E32 حاجة رفع الملفات (A16)؛ الويبهوك له كتلته أدناه بحد 4m
    client_max_body_size 50M;
    # cloudflared يعيد استعمال الاتصال الخامل حتى 90 ثانية: الإغلاق قبله ينتج 502 متقطعاً على POST
    keepalive_timeout 100s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # عامل خدمة الإشعارات: بلا كاش، وإلا بقي المتصفح وCloudflare على نسخة قديمة 30 يوماً
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vite build assets (immutable)
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket proxy for Laravel Reverb
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Reverb API (broadcasting auth)
    location /apps {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # فحص Docker كل 30 ثانية: بلا سطر في السجل
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # ويبهوك ميتا (E20): حد 4m (ميتا لا ترسل أكثر من 3MB)، ومهل قصيرة متسقة: PHP 55 < هنا 60 < Cloudflare 100.
    # إلى index.php مباشرة لا عبر try_files، فيُقاس حتى الجسم المرسل بلا Content-Length بحد هذه الكتلة.
    # لا limit_req: لا حد معدّل ولا 429 على طلب موقّع. السجل بلا query (رابط التحقق يحمل hub.verify_token)
    location = /api/whatsapp/webhook {
        client_max_body_size 4m;
        client_body_buffer_size 512k;
        client_body_timeout 20s;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to sensitive files
    location ~ /(?:composer|package|artisan|phpunit|\.env) {
        deny all;
    }

    # إلى docker logs المدوّرة لا إلى ملفات داخل طبقة الحاوية بلا تدوير
    access_log /dev/stdout noquery;
    error_log /dev/stderr warn;
}
